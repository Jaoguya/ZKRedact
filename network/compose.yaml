      # measured run records as a throughput plateau -- indistinguishable from a
      # sharding saturation knee. Measured at 2048: concurrency 1024 lost 98 of
      # 1024 authorizations exactly this way.
      # Checked against config/experiment.yaml by network.sh.
      - CORE_PEER_LIMITS_CONCURRENCY_GATEWAYSERVICE=8192
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
