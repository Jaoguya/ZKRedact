      - ./organizations/peerOrganizations/org4.example.com/peers/peer0.org4.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0org4:/var/hyperledger/production
    ports:
      - "17051:7051"
    depends_on:
      - orderer0
    networks:
      - fabric
    # From environment.peer_cpu_limit / peer_memory_limit.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6g

