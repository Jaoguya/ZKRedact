# Channel configuration.
#
# Covers the minimal topology. The measurement topology adds Org2..Org4 and two
# more orderers; see network/README.md.
#
# Batch parameters are the operative setting for the evaluation: they control
# how long a submitted vote waits before it is ordered, which is a direct
# component of Ref[10]'s authorization latency. They are set here to match
# environment.network.block_timeout_ms and block_max_transactions in
# config/experiment.yaml, and scripts/network.sh checks the two agree before
# bringing the network up — a channel batching on a different timeout than the
# config records would make the measured latency untraceable to any parameter.

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer0.example.com:7050

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: organizations/peerOrganizations/org1.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    # Anchor peers make this org discoverable to the others. Without them the
    # Gateway cannot assemble a cross-organisation endorsement plan and fails
    # with "no peer combination can satisfy the endorsement policy" — which
    # reads as a policy problem rather than a discovery one. The CLI hides this
    # because it is told each peer address explicitly.
    AnchorPeers:
      - Host: peer0.org1.example.com
        Port: 7051

  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: organizations/peerOrganizations/org2.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org2MSP.peer')"
    # Anchor peers make this org discoverable to the others. Without them the
    # Gateway cannot assemble a cross-organisation endorsement plan and fails
    # with "no peer combination can satisfy the endorsement policy" — which
    # reads as a policy problem rather than a discovery one. The CLI hides this
    # because it is told each peer address explicitly.
    AnchorPeers:
      - Host: peer0.org2.example.com
        Port: 7051

  - &Org3
    Name: Org3MSP
    ID: Org3MSP
    MSPDir: organizations/peerOrganizations/org3.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.peer', 'Org3MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org3MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org3MSP.peer')"
    # Anchor peers make this org discoverable to the others. Without them the
    # Gateway cannot assemble a cross-organisation endorsement plan and fails
    # with "no peer combination can satisfy the endorsement policy" — which
    # reads as a policy problem rather than a discovery one. The CLI hides this
    # because it is told each peer address explicitly.
    AnchorPeers:
      - Host: peer0.org3.example.com
        Port: 7051

  - &Org4
    Name: Org4MSP
    ID: Org4MSP
    MSPDir: organizations/peerOrganizations/org4.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org4MSP.admin', 'Org4MSP.peer', 'Org4MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org4MSP.admin', 'Org4MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org4MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org4MSP.peer')"
    # Anchor peers make this org discoverable to the others. Without them the
    # Gateway cannot assemble a cross-organisation endorsement plan and fails
    # with "no peer combination can satisfy the endorsement policy" — which
    # reads as a policy problem rather than a discovery one. The CLI hides this
    # because it is told each peer address explicitly.
    AnchorPeers:
      - Host: peer0.org4.example.com
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer0.example.com:7050

  # MUST match environment.network.block_timeout_ms in config/experiment.yaml.
  # A vote waits up to this long before ordering, so it is part of what Exp 1
  # measures.
  BatchTimeout: 250ms

  BatchSize:
    # MUST match environment.network.block_max_transactions.
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB

  EtcdRaft:
    Consenters:
      - Host: orderer0.example.com
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt

  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  # Minimal topology: one org, one orderer. Verification only.
  MinimalChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1

  # Measurement topology: 4 orgs, 3 Raft orderers.
  #
  # The endorsement policy is MAJORITY across organisations, so a transaction
  # needs signatures from more than one org. That is the cost the minimal
  # profile does not have, and it is a component of what Exp 1 measures — a
  # single-org channel would understate Ref[10] while looking like a full run.
  FullChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Addresses:
        - orderer0.example.com:7050
        - orderer1.example.com:7050
        - orderer2.example.com:7050
      EtcdRaft:
        Consenters:
          - Host: orderer0.example.com
            Port: 7050
            ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt
            ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/server.crt
          - Host: orderer1.example.com
            Port: 7050
            ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
            ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
          - Host: orderer2.example.com
            Port: 7050
            ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
            ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1
        - *Org2
        - *Org3
        - *Org4
