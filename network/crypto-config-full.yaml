      # nothing else — which stopped every fabric-transport run inside Setup.
      # Kept equal across orgs so repointing gateway.crypto_path at another org
      # does not reintroduce the shortfall. network.sh checks this bound.
      Count: 100

  - Name: Org3
    Domain: org3.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
      # docs/baselines/ref10-emt.md. That org alone must therefore cover the
      # whole registered node set, not just committee_size: Ref[10] draws each
      # committee from all of it, and a member votes under its own identity.
      #
      # So this tracks dataset.identities.count (100) in
