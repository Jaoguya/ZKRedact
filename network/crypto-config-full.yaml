# Identity material for the MEASUREMENT topology.
#
# 4 organisations x 2 peers plus a 3-node Raft orderer set, matching
# environment.network in config/experiment.yaml. scripts/network.sh checks the
# two agree before generating anything.
#
# Users per org: the committee members that vote. Ref[10] draws N_auth from the
# registered node set, and each member submits its ballot under its own Fabric
# identity, so there must be at least committee_size identities in total.

OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer0
        SANS: [localhost]
      - Hostname: orderer1
        SANS: [localhost]
      - Hostname: orderer2
        SANS: [localhost]

PeerOrgs:
  - Name: Org1
    Domain: org1.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # 8 per org.
      #
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
      # docs/baselines/ref10-emt.md. That org alone must therefore cover
      # committee_size, which config/experiment.yaml sets to 7.
      #
      # 4 was not enough and the shortfall stopped Setup rather than producing
      # a partial committee, which is the guard working; raising it here is the
      # fix that guard asks for.
      Count: 8

  - Name: Org2
    Domain: org2.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # 8 per org.
      #
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
      # docs/baselines/ref10-emt.md. That org alone must therefore cover
      # committee_size, which config/experiment.yaml sets to 7.
      #
      # 4 was not enough and the shortfall stopped Setup rather than producing
      # a partial committee, which is the guard working; raising it here is the
      # fix that guard asks for.
      Count: 8

  - Name: Org3
    Domain: org3.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # 8 per org.
      #
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
      # docs/baselines/ref10-emt.md. That org alone must therefore cover
      # committee_size, which config/experiment.yaml sets to 7.
      #
      # 4 was not enough and the shortfall stopped Setup rather than producing
      # a partial committee, which is the guard working; raising it here is the
      # fix that guard asks for.
      Count: 8

  - Name: Org4
    Domain: org4.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # 8 per org.
      #
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
