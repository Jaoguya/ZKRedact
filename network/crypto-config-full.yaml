# Identity material for the MEASUREMENT topology.
#
# 4 organisations x 2 peers plus a 3-node Raft orderer set, matching
# environment.network in config/experiment.yaml. scripts/network.sh checks the
# two agree before generating anything.
#
# Users per org: the committee members that vote. Ref[10] draws N_auth from the
# registered node set, and each member submits its ballot under its own Fabric
# identity, so there must be at least committee_size identities in total.

OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer0
        SANS: [localhost]
      - Hostname: orderer1
        SANS: [localhost]
      - Hostname: orderer2
        SANS: [localhost]

PeerOrgs:
  - Name: Org1
    Domain: org1.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # The gateway binds to ONE organisation's MSP, so committee members are
      # drawn from a single org's identities — see the deviation note in
      # docs/baselines/ref10-emt.md. That org alone must therefore cover the
      # whole registered node set, not just committee_size: Ref[10] draws each
      # committee from all of it, and a member votes under its own identity.
      #
      # So this tracks dataset.identities.count (100) in
      # config/experiment.yaml. It was 8 — enough for committee_size=7 and
      # nothing else — which stopped every fabric-transport run inside Setup.
      # Kept equal across orgs so repointing gateway.crypto_path at another org
      # does not reintroduce the shortfall. network.sh checks this bound.
      Count: 100

  - Name: Org2
    Domain: org2.example.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS: [localhost]
    Users:
      # The gateway binds to ONE organisation's MSP, so committee members are
