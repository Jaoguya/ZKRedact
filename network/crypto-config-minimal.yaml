# Identity material for the MINIMAL topology (verification only).
#
# One orderer organisation, one peer organisation, one peer. See
# network/README.md for why this cannot produce measurements.
#
# Users: the committee members that vote. Ref[10] draws N_auth from the
# registered node set, and each member submits its ballot under its own Fabric
# identity — a shared identity would make the contract's membership check
# validate the wrong thing. Count must be at least the configured
# committee_size, which scripts/network.sh verifies before deploying.

OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer0
        SANS:
          # The harness and the CLI reach the orderer as localhost from the
          # host, while containers reach it by hostname. Without localhost in
          # the SAN the TLS handshake fails with a certificate error that reads
          # like a network fault rather than a naming one.
          - localhost

PeerOrgs:
  - Name: Org1
    Domain: org1.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
    Users:
      # Must cover dataset.identities.count in config/experiment.yaml (100), not
      # merely committee_size.
      #
      # Ref[10] draws each committee from the WHOLE registered node set, and a
      # member votes under its own Fabric identity, so any of the 100 dataset
      # members may be called on. buildIdentityMap refuses a partial mapping —
      # it would let some committees vote and others not, which appears as a
      # denial rate that moves with the committee draw.
      #
      # 8 covered committee_size=7 and nothing else, so every fabric-transport
      # experiment failed inside Setup. network.sh now checks this bound.
      Count: 100
